name: Déploiement Vercel (production)

# Chaque push sur main déploie l'application en production sur Vercel.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   VERCEL_TOKEN        (obligatoire) token créé sur https://vercel.com/account/tokens
#   DATABASE_URL        (auth) chaîne Postgres du pooler de session Supabase
#   BETTER_AUTH_SECRET  (auth) secret de signature des sessions (openssl rand -base64 32)
#   EFI_ACCESS_CODE     code d'accès aux RPC planning
#
# Avec DATABASE_URL + BETTER_AUTH_SECRET : authentification Better Auth active,
# le code d'accès reste côté serveur (proxy /api/state).
# Sans eux : mode secours — le code est injecté dans js/access.js comme avant.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_SqbmusZ2yoVj29XvP7LfWarp
      VERCEL_PROJECT_ID: prj_sU6F7MlHJlAKIMRzTeUUiUZJmEDz
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du secret VERCEL_TOKEN
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Secret VERCEL_TOKEN manquant — créez un token sur https://vercel.com/account/tokens puis ajoutez-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances (better-auth, pg)
        run: npm ci

      - name: Tests avant mise en production
        run: node --test tests/*.test.mjs

      - name: Synchroniser les variables d'environnement Vercel (authentification)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EFI_ACCESS_CODE: ${{ secrets.EFI_ACCESS_CODE }}
        run: |
          sync_env() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx vercel@latest env add "$1" production --force --token="$VERCEL_TOKEN" > /dev/null 2>&1 \
                && echo "$1 : synchronisé" || echo "::warning::$1 : échec de synchronisation Vercel"
            else
              echo "$1 : secret absent — ignoré"
            fi
          }
          sync_env DATABASE_URL "$DATABASE_URL"
          sync_env BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          sync_env BETTER_AUTH_URL "https://efi-sand.vercel.app"
          sync_env EFI_ACCESS_CODE "$EFI_ACCESS_CODE"

      - name: Injecter le code d'accès (mode secours sans authentification)
        env:
          EFI_ACCESS_CODE: ${{ secrets.EFI_ACCESS_CODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BETTER_AUTH_SECRET" ]; then
            echo "Authentification active — le code d'accès reste côté serveur (pas d'injection)."
          elif [ -n "$EFI_ACCESS_CODE" ]; then
            printf 'globalThis.EFI_ACCESS_CODE = %s;\n' "$(node -e 'console.log(JSON.stringify(process.env.EFI_ACCESS_CODE))')" > js/access.js
            echo "Auth non configurée — auto-connexion par code injecté (mode secours)."
          else
            echo "Secret EFI_ACCESS_CODE absent — l'application demandera le code (bouton ☁)."
          fi

      - name: Déployer en production
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
