name: Fumée après déploiement

# Vercel déploie tout seul ; ce qu'aucun test unitaire ne voit, c'est une
# fonction serverless qui part en erreur une fois en ligne. On attend donc que
# Vercel annonce un déploiement réussi, puis on interroge les routes réelles.
#
# Ces vérifications ne demandent aucun secret : elles s'assurent au contraire
# que les routes protégées REFUSENT bien l'accès.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL à vérifier
        required: false

# Alias de production — ce que les utilisateurs atteignent réellement.
#
# On NE se sert PAS de « deployment_status.target_url » : Vercel y met l'URL
# immuable du déploiement (efi-xxxxxxxx-…), laquelle reste derrière la
# protection d'accès même en production et répond 302 vers son SSO. Seul
# l'alias est public, et c'est lui qu'il faut interroger.
env:
  PROD_URL: https://efi-rho.vercel.app

jobs:
  fumee:
    # Deux filtres, tous deux nécessaires :
    #  - « state == success » car deployment_status est émis à chaque
    #    changement d'état, y compris « pending » et « failure » ;
    #  - environnement de PRODUCTION uniquement. Les déploiements de
    #    prévisualisation sont derrière l'authentification Vercel et répondent
    #    302 vers son SSO : les interroger ne dirait rien de l'application.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production", "production"]'),
                github.event.deployment_status.environment))
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer l’URL
        id: cible
        run: |
          URL="${{ inputs.url || env.PROD_URL }}"
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cible : $URL"

      # Vercel bascule l'alias une fois le déploiement prêt : on laisse
      # quelques secondes pour ne pas interroger l'ancienne version.
      - name: Laisser l’alias basculer
        if: github.event_name == 'deployment_status'
        run: sleep 20

      - name: L’application répond
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
            --retry-all-errors "${{ steps.cible.outputs.url }}/")
          echo "GET / → $code"
          if [ "$code" = "302" ] || [ "$code" = "401" ]; then
            echo "::error::Déploiement protégé (redirection vers le SSO Vercel) : ce n’est pas la production."
            exit 1
          fi
          [ "$code" = "200" ]

      - name: Les modules du moteur sont servis
        run: |
          set -euo pipefail
          for f in js/app.js js/engine.js js/mcp.js js/persisted.js css/style.css; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ steps.cible.outputs.url }}/$f")
            echo "$f → $code"
            [ "$code" = "200" ]
          done

      - name: Le planning partagé exige une session
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ steps.cible.outputs.url }}/api/state")
          echo "GET /api/state → $code (401 attendu)"
          [ "$code" = "401" ]

      - name: La route MCP n’est jamais ouverte sans jeton
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' \
            "${{ steps.cible.outputs.url }}/api/mcp")
          echo "POST /api/mcp sans jeton → $code"
          # 503 = jetons non configurés (route fermée), 401 = jeton exigé.
          # Tout autre code signifierait un accès non protégé.
          case "$code" in
            503|401) echo "route protégée" ;;
            *) echo "::error::la route MCP répond $code sans jeton"; exit 1 ;;
          esac

      - name: La découverte OAuth est servie depuis la racine
        run: |
          set -euo pipefail
          # RFC 9728 et 8414 : ces documents se servent à la RACINE du domaine,
          # avec le chemin inséré après « .well-known ». Ils dépendent de
          # réécritures dans vercel.json — sans elles, le client MCP ne trouve
          # rien et abandonne l’autorisation SANS message exploitable. C’est
          # exactement le genre de panne qu’aucun test unitaire ne voit.
          #
          # Tant que MCP_OAUTH n’est pas activé, le plugin n’est pas chargé et
          # ces routes répondent 404 : c’est normal, on ne fait alors que
          # vérifier qu’elles ne cassent pas le déploiement.
          for c in /.well-known/oauth-protected-resource/api/mcp \
                   /.well-known/oauth-authorization-server/api/auth; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ steps.cible.outputs.url }}$c")
            echo "$c → $code"
            case "$code" in
              200|404) ;;
              *) echo "::error::$c répond $code — ni servi, ni proprement absent"; exit 1 ;;
            esac
          done

      - name: La route MCP refuse un mauvais jeton
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H 'authorization: Bearer jeton-manifestement-invalide' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' \
            "${{ steps.cible.outputs.url }}/api/mcp")
          echo "POST /api/mcp avec mauvais jeton → $code"
          case "$code" in
            503|401) echo "refus correct" ;;
            *) echo "::error::un jeton invalide obtient $code"; exit 1 ;;
          esac
