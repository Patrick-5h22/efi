<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFI — Planification formations & tests</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // L'application reste voilée tant que l'authentification n'est pas
    // tranchée (retiré par js/app.js : mode local, ou session vérifiée)
    document.documentElement.classList.add('auth-pending');
    // Application du thème avant le premier rendu (anti-flash)
    try {
      const t = JSON.parse(localStorage.getItem('efi-theme') || '{}');
      const preset = t.preset || 'teal';
      document.documentElement.dataset.theme = preset;
      const dark = t.mode === 'dark' || ((t.mode || 'auto') === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    } catch {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-icon">📅</span>
        <div>
          <div class="brand-title">EFI Planning</div>
          <div class="brand-sub">Formations & tests 2026</div>
        </div>
      </div>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-footer">
        <div id="user-zone" class="user-zone" hidden>
          <span id="user-name" class="user-name"></span>
          <button id="btn-logout" class="btn btn-ghost" title="Se déconnecter">⏻</button>
        </div>
        <button id="cmdk-btn" class="btn btn-ghost" title="Palette de commandes (Ctrl+K)">⌘K</button>
        <span id="theme-menu"><button id="theme-btn" class="btn btn-ghost" title="Thème et mode sombre" aria-haspopup="menu"><span class="theme-dot" style="background:oklch(0.52 0.105 223.128)"></span></button></span>
        <button id="cloud-status" class="btn btn-ghost" data-status="off" title="Base partagée">☁</button>
        <button id="btn-undo" class="btn btn-ghost" title="Annuler (Ctrl+Z)">↩</button>
        <button id="btn-redo" class="btn btn-ghost" title="Rétablir (Ctrl+Y)">↪</button>
        <button id="btn-export" class="btn btn-ghost" title="Exporter les données (JSON)">⬇ Exporter</button>
        <button id="btn-import" class="btn btn-ghost" title="Importer une sauvegarde (JSON)">⬆ Importer</button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
      </div>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <div id="boot-veil" aria-hidden="true"><span class="boot-brand">Cipecma<span class="boot-dot">.</span></span></div>
  <div id="toast-zone" aria-live="polite"></div>
  <script src="js/access.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
