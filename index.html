<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFI — Planification formations & tests</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-icon">📅</span>
        <div>
          <div class="brand-title">EFI Planning</div>
          <div class="brand-sub">Formations & tests 2026</div>
        </div>
      </div>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-footer">
        <button id="btn-undo" class="btn btn-ghost" title="Annuler (Ctrl+Z)">↩</button>
        <button id="btn-redo" class="btn btn-ghost" title="Rétablir (Ctrl+Y)">↪</button>
        <button id="btn-export" class="btn btn-ghost" title="Exporter les données (JSON)">⬇ Exporter</button>
        <button id="btn-import" class="btn btn-ghost" title="Importer une sauvegarde (JSON)">⬆ Importer</button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
      </div>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <div id="toast-zone" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
