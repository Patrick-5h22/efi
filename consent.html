<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorisation — EFI Planning</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* Page volontairement autonome : elle ne charge pas l'application. C'est un
     écran d'autorisation, sa surface doit rester la plus petite possible. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg, #f6f7f9);
    color: var(--foreground, #16181d);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .carte {
    width: 100%;
    max-width: 460px;
    background: var(--card, #fff);
    border: 1px solid var(--border, #d9dde3);
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sous { color: var(--muted-foreground, #5d6470); margin: 0 0 20px; font-size: 14px; }
  .client {
    font-weight: 600;
    background: var(--muted, #eef0f4);
    border: 1px solid var(--border, #d9dde3);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 18px;
    word-break: break-word;
  }
  ul { margin: 0 0 20px; padding-left: 20px; }
  li { margin-bottom: 6px; }
  .compte { font-size: 13px; color: var(--muted-foreground, #5d6470); margin: 0 0 20px; }
  .boutons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 140px;
    font: inherit;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border, #d9dde3);
    background: var(--card, #fff);
    color: inherit;
    cursor: pointer;
  }
  button.principal {
    background: var(--primary, #1f6f86);
    color: var(--primary-foreground, #fff);
    border-color: transparent;
    font-weight: 600;
  }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--primary, #1f6f86); outline-offset: 2px; }
  .erreur {
    background: var(--error-bg, #fdecec);
    color: var(--error, #a3241f);
    border: 1px solid currentColor;
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 18px;
    font-size: 14px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="carte" role="main">
  <div id="erreur" class="erreur" hidden></div>
  <h1 id="titre">Autorisation</h1>
  <p class="sous" id="sous">Vérification en cours…</p>
  <div id="corps" hidden>
    <div class="client" id="client"></div>
    <p style="margin:0 0 8px;font-size:14px">Cette application pourra, <strong>en votre nom</strong> :</p>
    <ul id="portees"></ul>
    <p class="compte" id="compte"></p>
    <div class="boutons">
      <button type="button" id="refuser">Refuser</button>
      <button type="button" id="accepter" class="principal">Autoriser</button>
    </div>
  </div>
  <div id="connexion" hidden>
    <div class="boutons">
      <button type="button" id="microsoft" class="principal">Se connecter avec Microsoft</button>
    </div>
  </div>
</main>

<script type="module">
// Écran d'autorisation OAuth — sert /consent et /login.
//
// Le contrat a été établi en lisant le code du fournisseur puis vérifié contre
// une vraie base, pas déduit de la documentation :
//
//   La query signée que porte l'URL de cette page (sig, exp, ba_iat, ba_param…)
//   doit être renvoyée TELLE QUELLE dans le corps, champ « oauth_query ». Un
//   crochet côté serveur en vérifie la signature et restitue l'état de la
//   demande d'autorisation. Ni cookie ni paramètre d'URL : c'est ce champ, et
//   la moindre retouche invalide la signature.

const QUERY = window.location.search.replace(/^\?/, '');
const params = new URLSearchParams(QUERY);
const surLogin = window.location.pathname.replace(/\/$/, '').endsWith('/login');

const $ = (id) => document.getElementById(id);
const montrer = (id) => { $(id).hidden = false; };

function echouer(message) {
  $('erreur').textContent = message;
  $('erreur').hidden = false;
  $('sous').textContent = '';
}

// Ce que chaque portée autorise, dit à qui va le lire — pas en jargon OAuth.
const LIBELLES = {
  openid: 'vous identifier',
  profile: 'connaître votre nom',
  email: 'connaître votre adresse professionnelle',
  offline_access: 'garder cet accès sans vous redemander l’autorisation à chaque fois',
};

async function json(url, options) {
  const res = await fetch(url, { credentials: 'same-origin', ...options });
  let corps = null;
  try { corps = await res.json(); } catch { /* corps vide */ }
  return { ok: res.ok, status: res.status, corps };
}

// Une réponse d'autorisation renvoie l'adresse de retour du client : on y
// envoie le navigateur, c'est ce qui referme la boucle.
function suivre(corps) {
  const url = corps?.url || corps?.redirectURI || corps?.redirect_uri;
  if (!url) return echouer('Le serveur n’a pas indiqué où poursuivre. Reprenez depuis l’application qui vous a envoyé ici.');
  window.location.href = url;
}

async function demarrer() {
  if (!QUERY) {
    $('titre').textContent = 'Rien à autoriser';
    return echouer('Cette page se fait ouvrir par une application qui demande l’accès au planning. Il n’y a rien à valider en y venant directement.');
  }

  const session = await json('/api/auth/get-session');
  if (!session.corps?.user) {
    $('titre').textContent = 'Connexion requise';
    $('sous').textContent = 'Connectez-vous avec votre compte CIPECMA pour continuer.';
    montrer('connexion');
    return;
  }

  // Session déjà ouverte, mais arrivée par /login : on rend la main au flux.
  if (surLogin) {
    const r = await json('/api/auth/oauth2/continue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postLogin: true, oauth_query: QUERY }),
    });
    if (!r.ok) return echouer(r.corps?.error_description || 'La demande d’autorisation a expiré. Relancez-la depuis l’application.');
    return suivre(r.corps);
  }

  // Le nom lisible du client, plutôt qu'un identifiant opaque.
  const clientId = params.get('client_id') || '';
  const pub = await json(`/api/auth/oauth2/public-client?client_id=${encodeURIComponent(clientId)}`);
  $('client').textContent = pub.corps?.client_name || clientId || 'Application inconnue';

  const portees = (params.get('scope') || '').split(/\s+/).filter(Boolean);
  $('portees').innerHTML = '';
  for (const p of portees) {
    const li = document.createElement('li');
    li.textContent = LIBELLES[p] || p;
    $('portees').appendChild(li);
  }
  const u = session.corps.user;
  $('compte').textContent = `Compte : ${u.name || u.email}`;

  $('titre').textContent = 'Autoriser l’accès au planning';
  $('sous').textContent = 'Une application demande à consulter le planning et à poser des pré-réservations en votre nom.';
  montrer('corps');
}

async function repondre(accepte) {
  for (const b of ['accepter', 'refuser']) $(b).disabled = true;
  const r = await json('/api/auth/oauth2/consent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ accept: accepte, oauth_query: QUERY }),
  });
  if (!r.ok) {
    for (const b of ['accepter', 'refuser']) $(b).disabled = false;
    return echouer(r.corps?.error_description || 'La demande d’autorisation a expiré. Relancez-la depuis l’application.');
  }
  suivre(r.corps);
}

$('accepter').addEventListener('click', () => repondre(true));
$('refuser').addEventListener('click', () => repondre(false));

$('microsoft').addEventListener('click', async () => {
  $('microsoft').disabled = true;
  // On revient sur CETTE page, avec la même query signée : le flux reprend
  // exactement où il s'était arrêté.
  const retour = window.location.pathname + window.location.search;
  const r = await json('/api/auth/sign-in/social', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ provider: 'microsoft', callbackURL: retour, errorCallbackURL: retour }),
  });
  if (!r.corps?.url) {
    $('microsoft').disabled = false;
    return echouer(r.corps?.message || 'La connexion Microsoft n’est pas disponible sur ce déploiement.');
  }
  window.location.href = r.corps.url;
});

demarrer().catch(() => echouer('Impossible de joindre le service d’authentification. Réessayez dans un instant.'));
</script>
</body>
</html>
